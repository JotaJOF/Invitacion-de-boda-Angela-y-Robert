<!DOCTYPE html>
<html lang="es" class="is-loading-content">
  <head>
    <meta charset="UTF-8" />
    <style>html.is-loading-content img[data-key] { visibility: hidden; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Invitación Angela y Robert</title>
    <meta name="description" content="Acompaña a Angela Palmerston y Robert Wilson en la celebración de su boda en Monterrey, Nuevo León." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Invitación Angela y Robert" />
    <meta property="og:description" content="Una invitación de boda para compartir una fecha especial con Angela y Robert." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Invitación Angela y Robert" />
    <meta name="twitter:description" content="Una invitación de boda para compartir una fecha especial con Angela y Robert." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <footer class="site-footer">
      <button class="admin-open" id="admin-open" type="button">Ingresar</button>
    </footer>

    <dialog class="login-dialog" id="login-dialog" aria-labelledby="login-title">
      <form class="login-card" id="login-form">
        <button class="dialog-close" id="login-close" type="button" aria-label="Cerrar">×</button>
        <p class="eyebrow">ACCESO PRIVADO</p>
        <h2 id="login-title">Administrar sitio</h2>
        <label for="admin-username">Usuario</label>
        <input id="admin-username" name="username" autocomplete="username" required />
        <label for="admin-password">Contraseña</label>
        <input
          id="admin-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="form-message" id="login-message" role="status"></p>
        <button class="button button-olive login-submit" type="submit">ENTRAR</button>
      </form>
    </dialog>

    <aside class="admin-toolbar" id="admin-toolbar" aria-label="Herramientas de edición" hidden>
      <span class="toolbar-label" id="toolbar-message">Edición activada</span>
      <button class="button button-olive toolbar-save" id="save-content" type="button">
        GUARDAR
      </button>
      <button class="toolbar-text" id="cancel-edit" type="button">Salir</button>
    </aside>
    <input id="image-picker" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>  
    <script type="module" src="/src/main.tsx"></script>  
   <link rel="stylesheet" href="/admin.css?v=4" />  
<script src="/admin.js?v=4" defer></script>  
  </body>  
</html>
