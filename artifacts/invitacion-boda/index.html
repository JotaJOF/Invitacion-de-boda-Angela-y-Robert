<!DOCTYPE html>
<html lang="es" class="is-loading-content">
  <head>
    <meta charset="UTF-8" />
    <style>html.is-loading-content img[data-key] { visibility: hidden; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Invitación Angela y Robert</title>
    <meta name="description" content="Acompaña a Angela Palmerston y Robert Wilson en la celebración de su boda en Monterrey, Nuevo León." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Invitación Angela y Robert" />
    <meta property="og:description" content="Una invitación de boda para compartir una fecha especial con Angela y Robert." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Invitación Angela y Robert" />
    <meta name="twitter:description" content="Una invitación de boda para compartir una fecha especial con Angela y Robert." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <footer class="site-footer">
      <button class="admin-open" id="admin-open" type="button">Ingresar</button>
    </footer>

    <dialog class="login-dialog" id="login-dialog" aria-labelledby="login-title">
      <form class="login-card" id="login-form">
        <button class="dialog-close" id="login-close" type="button" aria-label="Cerrar">×</button>
        <p class="eyebrow">ACCESO PRIVADO</p>
        <h2 id="login-title">Administrar sitio</h2>
        <label for="admin-username">Usuario</label>
        <input id="admin-username" name="username" autocomplete="username" required />
        <label for="admin-password">Contraseña</label>
        <input
          id="admin-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="form-message" id="login-message" role="status"></p>
        <button class="button button-olive login-submit" type="submit">ENTRAR</button>
      </form>
    </dialog>

    <aside class="admin-toolbar" id="admin-toolbar" aria-label="Herramientas de edición" hidden>
      <span class="toolbar-label" id="toolbar-message">Edición activada</span>
      <button class="button button-olive toolbar-save" id="save-content" type="button">
        GUARDAR
      </button>
      <button class="toolbar-text" id="cancel-edit" type="button">Salir</button>
    </aside>
    <aside class="admin-panel" id="admin-panel" aria-label="Panel de administración" hidden>  
      <div class="admin-panel-card">
        <a class="panel-home" href="/" target="_blank" aria-label="Ver invitación">✉</a>
        <p class="eyebrow">ADMINISTRACIÓN</p>  
        <h2>Datos del evento</h2>  
        <label for="cfg-location">Ubicación del lugar (URL de Google Maps)</label>  
        <input id="cfg-location" type="url" placeholder="https://maps.google.com/..." />  
        <label for="cfg-whatsapp">WhatsApp (número con código de país)</label>  
        <input id="cfg-whatsapp" type="tel" placeholder="+52 81 0000 0000" />  
        <label for="cfg-date">Fecha del evento</label>  
        <input id="cfg-date" type="datetime-local" />  
        <label for="cfg-drive">Carpeta de Google Drive para fotos/videos de invitados</label>  
        <input id="cfg-drive" type="url" placeholder="https://drive.google.com/drive/folders/..." />  
        <button class="button" id="guests-list" type="button">VER LISTA DE INVITADOS</button>  
        <p class="form-message" id="panel-message" role="status"></p>  
        <div class="admin-panel-actions">  
          <button class="button" id="panel-edit" type="button">EDITAR TU INVITACIÓN</button>  
          <button class="button button-olive" id="panel-save" type="button">GUARDAR DATOS</button>  
        </div>  
        <p class="panel-note">Los cambios de texto e imágenes se hacen desde "Editar tu invitación".</p>  
      </div>  
    </aside>  
    <aside class="admin-float-bar" id="admin-float-bar" hidden>  
      <button class="float-back" id="float-back" type="button">← ATRÁS</button>  
      <button class="button button-olive" id="float-save" type="button">GUARDAR</button>  
    </aside>
    <aside class="guests-modal" id="guests-modal" hidden>  
      <div class="guests-card">  
        <button class="dialog-close" id="guests-close" type="button" aria-label="Cerrar">×</button>  
        <button class="button" id="guests-print" type="button">IMPRIMIR</button>  
        <h2>Lista de invitados</h2>  
        <div class="guests-table-wrap">  
          <table class="guests-table">  
            <thead><tr><th>#</th><th>Nombre</th><th>Confirmación</th><th>Pases</th><th>Mensaje</th><th>Fecha envío</th><th>Modificado</th><th>Vía / WhatsApp</th></tr></thead>  
            <tbody id="guests-body"></tbody>  
          </table>  
        </div>  
        <div class="guests-totals" id="guests-totals"></div>  
      </div>  
    </aside>
    <input id="image-picker" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/mp4,video/webm,video/quicktime" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>  
    <script type="module" src="/src/main.tsx"></script>  
   <link rel="stylesheet" href="/admin.css?v=5" />  
<script src="/admin.js?v=4" defer></script>  
  </body>  
</html>
