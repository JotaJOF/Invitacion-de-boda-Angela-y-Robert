name = "invitacion"  
main = "worker/index.ts"  
compatibility_date = "2026-10-01"  
compatibility_flags = ["nodejs_compat"]  
workers_dev = true  
  
[assets]  
directory = "./artifacts/invitacion-boda/dist/public"  
binding = "ASSETS"  
run_worker_first = ["/api/*"]  
  
[observability]  
enabled = true

[[r2_buckets]]  
binding = "MEDIA"  
bucket_name = "invitacion-media"  
  
[vars]  
R2_PUBLIC_URL = "https://pub-afc411e8bfc7409ca401c9bc07015cac.r2.dev"
