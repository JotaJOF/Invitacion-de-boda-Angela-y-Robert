<!doctype html>  
<html lang="es">  
  <head>  
    <meta charset="UTF-8" />  
    <meta name="viewport" content="width=device-width, initial-scale=1" />  
    <title>Invitados — Panel</title>  
    <link rel="stylesheet" href="/css/styles.css" />  
    <style>  
      body {  
        font-family: "Montserrat", sans-serif;  
        padding: 2rem;  
        max-width: 960px;  
        margin: auto;  
      }  
      table {  
        width: 100%;  
        border-collapse: collapse;  
        margin-top: 1rem;  
        font-size: 0.85rem;  
      }  
      td,  
      th {  
        border: 1px solid #ccc;  
        padding: 0.4rem;  
        text-align: left;  
      }  
      textarea {  
        width: 100%;  
        min-height: 140px;  
        font-family: monospace;  
      }  
      button {  
        font-family: inherit;  
        cursor: pointer;  
        margin: 0.4rem 0.4rem 0.4rem 0;  
        padding: 0.5rem 1rem;  
        background: #596d37;  
        color: #fff;  
        border: none;  
        border-radius: 4px;  
      }  
      a.wa {  
        color: #596d37;  
      }  
      .toplink {  
        color: #596d37;  
      }  
      #panel-message {  
        color: #a33;  
      }  
    </style>  
  </head>  
  <body>  
    <h1>Invitados</h1>  
    <p><a class="toplink" href="/">← Volver a la invitación</a></p>  
    <p id="panel-message"></p>  
    <p>  
      Pega tu lista desde Excel: <strong>una línea por invitado</strong> con el  
      formato <code>Nombre, pases, teléfono (opcional)</code>  
    </p>  
    <textarea  
      id="guest-input"  
      placeholder="Nicol &amp; Josué, 2, 5218112345678&#10;Carlos y María, 5&#10;Juan, 1"  
    ></textarea>  
    <button id="add-guests" type="button">AGREGAR Y GENERAR LINKS</button>  
    <button id="reload" type="button">RECARGAR</button>  
    <table>  
      <thead>  
        <tr>  
          <th>Nombre</th>  
          <th>Pases</th>  
          <th>Link</th>  
          <th>Abrió</th>  
          <th>Confirmó</th>  
          <th>WhatsApp</th>  
        </tr>  
      </thead>  
      <tbody id="guest-table"></tbody>  
    </table>  
    <script src="/js/invitados.js" defer></script>  
  </body>  
</html>
