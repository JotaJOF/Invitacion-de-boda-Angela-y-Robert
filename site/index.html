<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Reserva la fecha y acompáñanos a celebrar la boda de Angela y Robert."
    />
    <meta name="theme-color" content="#596d37" />
    <title>Angela &amp; Robert — Reserva la fecha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <header class="invitation-banner">
      <h1>
        <span data-key="invitation_heading_line_1">QUEREMOS COMPARTIR CONTIGO LA</span>
        <span data-key="invitation_heading_line_2">ALEGRÍA DE CELEBRAR</span>
        <span data-key="invitation_heading_line_3">NUESTRA BODA</span>
      </h1>
    </header>

    <main class="invitation-page">
      <section class="save-date" aria-label="Reserva la fecha de nuestra boda">
        <div class="save-date-art">
          <img
            class="envelope-art"
            data-key="envelope_image"
            src="/assets/envelope-couple.webp"
            alt="Sobre verde con una fotografía de Angela y Robert"
            fetchpriority="high"
          />
          <img
            class="date-card-art"
            data-key="date_card_image"
            src="/assets/save-the-date.webp"
            alt="Reserva esta fecha: 13 de marzo de 2027"
          />
        </div>
        <a
          class="calendar-button"
          href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Angela%20y%20Robert%20%E2%80%94%20Nuestra%20boda&amp;dates=20270313%2F20270314"
          target="_blank"
          rel="noreferrer"
        ><span data-key="calendar_cta">AGENDAR EN CALENDARIO</span></a>
      </section>

      <section
        class="countdown"
        id="countdown"
        data-target-date="2027-03-13T00:00:00-04:00"
        aria-label="Cuenta regresiva para la boda"
      >
        <img
          class="countdown-background"
          data-key="countdown_background"
          src="/assets/roses-countdown.webp"
          alt=""
          aria-hidden="true"
        />
        <div class="countdown-content">
          <h2 class="countdown-heading">
            <span class="countdown-script" data-key="countdown_title_script">Solo</span>
            <span class="countdown-word" data-key="countdown_title_word">FALTAN</span>
          </h2>
          <div class="countdown-grid" aria-live="off">
            <div class="countdown-unit"><strong id="countdown-days">000</strong><span data-key="countdown_days_label">DÍAS</span></div>
            <div class="countdown-unit"><strong id="countdown-hours">00</strong><span data-key="countdown_hours_label">HORAS</span></div>
            <div class="countdown-unit"><strong id="countdown-minutes">00</strong><span data-key="countdown_minutes_label">MINUTOS</span></div>
            <div class="countdown-unit"><strong id="countdown-seconds">00</strong><span data-key="countdown_seconds_label">SEGUNDOS</span></div>
          </div>
        </div>
      </section>

      <section class="closing-photo-section" aria-label="Una fotografía de los novios">
        <img
          class="closing-photo"
          data-key="closing_photo"
          src="/assets/couple-veil.webp"
          alt="Angela y Robert bajo el velo de la novia"
          loading="lazy"
        />
      </section>
    </main>

    <footer class="site-footer">
      <button class="admin-open" id="admin-open" type="button">ADMINISTRAR SITIO</button>
    </footer>

    <dialog class="login-dialog" id="login-dialog" aria-labelledby="login-title">
      <form class="login-card" id="login-form">
        <button class="dialog-close" id="login-close" type="button" aria-label="Cerrar">×</button>
        <p class="eyebrow">ACCESO PRIVADO</p>
        <h2 id="login-title">Administrar sitio</h2>
        <label for="admin-username">Usuario</label>
        <input id="admin-username" name="username" autocomplete="username" required />
        <label for="admin-password">Contraseña</label>
        <input
          id="admin-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="form-message" id="login-message" role="status"></p>
        <button class="button button-olive login-submit" type="submit">ENTRAR</button>
      </form>
    </dialog>

    <aside class="admin-toolbar" id="admin-toolbar" aria-label="Herramientas de edición" hidden>
      <span class="toolbar-label" id="toolbar-message">Edición activada</span>
      <button class="button button-olive toolbar-save" id="save-content" type="button">
        GUARDAR
      </button>
      <button class="toolbar-text" id="cancel-edit" type="button">Salir</button>
    </aside>
    <input id="image-picker" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
